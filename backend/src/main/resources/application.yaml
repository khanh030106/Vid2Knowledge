spring:
  application:
    name: vid2knowledge-backend

#--------------AI-------------------------------

  gemini:
    api-key: ${GEMINI_API_KEY:}

#------------DB----------------------------------

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10
      minium-idle: 2
      connection-timeout: 3000


